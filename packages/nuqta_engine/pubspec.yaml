name: nuqta_engine
description: "On-device Nuqta-OCR (Arabic OCR) for Flutter: llama.cpp and the upstream Nuqta engine through dart:ffi."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.5.4

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
